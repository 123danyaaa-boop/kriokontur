  term: "2035-2040, заказ внутри года"
  payment_terms: "Оплата только за отобранный объём, take-or-pay отсутствует; тариф за резерв платится за зарезервированную мощность"
  liability: "Ответственность ограничена возвратом платы за резерв за непоставленный объём"
  revision_rule: "Объём пересматривается ежеквартально, срок поставки 4 месяца сохраняется"
  risk_allocation: "Риск объёма на поставщике, риск цены на операторе: канал дороже базового"
  flexibility: "Главный инструмент гибкости плана: объём можно менять без штрафа"
  status: TEAM_ASSUMPTION

