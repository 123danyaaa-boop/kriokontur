# Контрактно-финансовая архитектура команды (TEAM_DECISION).
#
# Правило файла: числовые условия канала (мощность, цена, тариф резервирования, доля
# take-or-pay, срок поставки, год доступности) СЮДА НЕ ПЕРЕПИСЫВАЮТСЯ. Они читаются из
# data/supply_sources.csv в момент сборки карточки, иначе появилась бы вторая копия
# контрольных данных, способная с ними разойтись. Тест test_contracts.py это проверяет.
#
# Здесь живёт только то, чего в CASE_INPUT нет: контрагент, предмет, ответственность,
# правила пересмотра, распределение рисков, порядок оплаты и параметры вызова партии.
# Каждое такое условие это TEAM_ASSUMPTION коммерческой рамки, а не факт организатора.

- contract_id: C-A
  source_id: A
  counterparty: "Земной базовый поставщик (Earth-Core)"
  subject: "Долгосрочная поставка криотоплива с Земли с резервированием мощности"
  term: "2035-2040, годовые объёмные обязательства"
  payment_terms: "Оплата по факту отбора плюс годовой минимум take-or-pay; тариф за резерв платится помесячно равными долями"
  liability: "Недопоставка по вине поставщика: возврат платы за резерв пропорционально непоставленному объёму и оплата разницы цены при замещении гибким каналом"
  revision_rule: "Пересмотр объёма на следующий год до 30 сентября текущего; цена постоянная в ценах 2035 года"
  risk_allocation: "Риск объёма на операторе (take-or-pay 70%), риск срыва рейса на поставщике, ценовой риск разделён через фиксированную цену"
  flexibility: "Снижение годового объёма без штрафа в пределах доли take-or-pay"
  status: TEAM_ASSUMPTION

