# Расчёт на перспективу. Всё в этом файле это TEAM_RESEARCH: данных организатора за 2040 год нет.
last_year: 2048
low_factor: 0.80      # те же пропорции, что у кейса в 2040 году: 312 / 390
high_factor: 1.25     # 487,5 / 390

demand_methods:
  increment:
    type: increment
    decay: 1.0
    basis: "сохраняем последний годовой прирост кейса, 2039→2040 это +70 т/год"
  saturating:
    type: logistic
    ceiling: 700
    rate: 0.45
    basis: "логистическое насыщение: рынок цислунарных заправок выходит на плато около 700 т/год"
  plateau:
    type: flat
    basis: "консервативная гипотеза: после 2040 года спрос не растёт"

extensions:
  ZBO2:
    name: "Вторая очередь хранилища"
    storage:
      id: ZBO2
      capacity: 240
      loss: 0.012
      holding: 0.72
      capex: 260
      opex: 20
      from: 2041
    basis: >
      Ёмкость 120 т перестаёт вмещать 45-дневный резерв при спросе выше примерно 700 т/год
      вместе с месячной поставкой. CAPEX взят пропорционально первой модернизации на тонну
      добавленной ёмкости, это допущение команды.
  LUNAR_ISRU_PHASE2:
    name: "Вторая очередь лунного производства"
    source:
      id: D2
      name: Lunar-ISRU-2
      capacity: 120
      price: 3.0
      reservation: 0
      take_or_pay: 0
      lead: 2
      available_from: 2043
      reliability: "constant:0.93"
    investment:
      exercise_cost: 1000
      total: 1000
      opex: 50
      rule: "финансирование за два года до ввода"
    basis: >
      Вторая очередь дешевле первой (1000 против 1250) и имеет меньший постоянный OPEX,
      потому что площадка, энергетика и транспортный узел уже построены. Это допущение
      команды об эффекте уже понесённых затрат, а не данные кейса.
  EARTH_NEW_2:
    name: "Второй новый земной поставщик"
    source:
      id: C2
      name: Earth-New-2
      capacity: 130
      price: 7.1
      reservation: 0.30
      take_or_pay: 0.5
      lead: 18
      available_from: 2043
      reliability: "first_operating_year:0.88;later:0.94"
    investment:
      option_fee: 90
      exercise_cost: 270
      total: 360
      opex: 0
      rule: "как Earth-New в кейсе"
    basis: >
      Честная альтернатива лунной второй очереди: те же условия, что у Earth-New в кейсе.
      Нужна, чтобы вывод про Луну не был получен из отсутствия земного варианта.

notes:
  - "Цены остаются в постоянных ценах 2035 года: реальной инфляции и удешевления запусков не закладываем."
  - "Ограничения кейса на добавленные годы не переносятся: лимиты CAPEX проверяются на 2037 и 2040, как и было."
  - "Требования 97% и 99% продолжают действовать как ориентир и на новых годах."
