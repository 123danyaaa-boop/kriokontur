# Реестр рисков команды. Каждый риск связан со сценарием, который реально пересчитывается.
# Вероятность это диапазон или сценарное допущение, а не выдуманная точность.
- risk_id: R1
  event: "Подготовка нового поставщика идёт по верхней границе интервала"
  cause: "Lead time Earth-New задан кейсом интервалом 18–24 месяца, мы планировали по нижней границе"
  affected_parameter: "commissioning_delay_months[Earth-New] = 6"
  period: "2036-2038"
  probability: 0.35
  probability_basis: "диапазон 0,2–0,5: организатор задал интервал, распределения внутри него нет"
  scenario_id: TEAM_RISK_EARTH_NEW_DELAY
  owner: "менеджер контрактов"
  mitigation: "реализовать опцион на год раньше или добрать объём гибким каналом"
  residual: "смещение остаётся, но закрывается гибким каналом при росте цены"
  dependencies: "усиливается при задержке лунной установки"
- risk_id: R2
  event: "Лунная установка выходит на половину плановой производительности"
  cause: "Первая очередь ISRU, надёжность кейса в первый год 0,78"
  affected_parameter: "actual_delivery_share[Lunar-ISRU] = 0.50 / 0.60 / 0.70"
  period: "2038-2040"
  probability: 0.30
  probability_basis: "сценарное допущение тяжелее профиля надёжности кейса 0,78 / 0,90 / 0,93"
  scenario_id: TEAM_RISK_ISRU_UNDERPERFORMANCE
  owner: "оператор узла"
  mitigation: "держать резервирование Earth-Core и не снимать гибкий канал после 2038 года"
  residual: "рост закупочных расходов при сохранении обслуживания"
  dependencies: "независим от ценовых шоков"
- risk_id: R3
  event: "Базовый земной канал недоступен половину года"
  cause: "Приостановка парка носителей у поставщика"
  affected_parameter: "capacity_multiplier[Earth-Core] = 0.5 в 2037"
  period: "2037"
  probability: 0.15
  probability_basis: "сценарное допущение, статистики по учебному каналу нет"
  scenario_id: TEAM_RISK_CORE_OUTAGE
  owner: "оператор узла"
  mitigation: "физический запас 45 суток и договор на аварийную поставку"
  residual: "take-or-pay остаётся оплаченным, это прямая потеря"
  dependencies: "совпадение с ростом цен усиливает эффект"
- risk_id: R4
  event: "Рост стоимости доставки с Земли из-за внешних ограничений"
  cause: "Изменение доступности поставщиков, страховых и логистических затрат"
  affected_parameter: "variable_price_multiplier земных каналов 1,25–1,6"
  period: "2036-2038"
  probability: null
  probability_basis: "вероятность не назначаем: статистики нет, работаем диапазоном"
  scenario_id: TEAM_GEO_PRICE_SHOCK
  owner: "финансовая сторона"
  mitigation: "доля лунного топлива и раннее резервирование по фиксированным ставкам"
  residual: "остаточная зависимость от земных каналов до ввода Луны"
  dependencies: "может совпасть с обязательным стрессом, отдельный сценарий TEAM_GEO_WITH_STRESS"
