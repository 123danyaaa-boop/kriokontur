# Реестр рисков команды. Риск это не клетка матрицы, а изменение конкретного входа модели
# с измеримым последствием: сценарий (спрос, цены, доступность) или решение плана
# (сроки ввода, допущения, политика запаса). Всё пересчитывается тем же движком.
#
# Реестр собран под финальный план: без Lunar-ISRU, ZBO с 2036, Earth-New с опционом 2035,
# физический резерв 45 суток. Поэтому здесь нет рисков лунной установки как главных: для этого
# плана они не реализуются. Риск с нулевым последствием оставлен сознательно и помечен как
# проверка устойчивости — это результат расчёта, а не пропуск.
#
# Вероятность: где статистики нет, вместо ложной точности стоит диапазон
# (probability_low / probability_high) и сценарное основание.

- risk_id: R1
  event: "Базовый земной канал стоит половину 2037 года"
  cause: "Приостановка парка носителей у поставщика Earth-Core"
  affected_parameter: "capacity_multiplier[Earth-Core] = 0.5 в 2037"
  period: "2037"
  probability: 0.15
  probability_low: 0.05
  probability_high: 0.25
  probability_basis: >
    Статистики по учебному каналу нет. Диапазон 5-25% это сценарное допущение команды,
    ожидаемое значение приводится вместе с границами и не используется как единственный вывод.
  scenario_id: TEAM_RISK_CORE_OUTAGE
  owner: "оператор узла"
  mitigations: [M1, M2, M7]
  mitigation: "Резерв аварийного канала и физический запас 45 суток"
  residual: "Take-or-pay Earth-Core остаётся оплаченным: это прямая потеря даже при полной замене объёма"
  dependencies: "Усиливается ценовым шоком R4 и совпадением с обязательным стрессом"

- risk_id: R2
  event: "Модернизация хранилища вводится на год позже решения"
  cause: "Пусконаладка ZBO затягивается: срок ввода кейсом не задан, наше допущение 0 месяцев"
  affected_parameter: "assumptions.storage_commissioning_lag_months = 12"
  period: "2036-2037"
  probability: 0.20
  probability_low: 0.10
  probability_high: 0.35
  probability_basis: >
    Основание: кейс задаёт только год доступности опции, срок пусконаладки не задан.
    Диапазон отражает типичную неопределённость ввода объекта, точечная оценка не заявляется.
  scenario_id: MANDATORY_STRESS
  owner: "руководитель инвестиционного проекта"
  mitigations: [M3]
  mitigation: "Решение по ZBO уже принято в самый ранний возможный год (проверяется расчётом)"
  residual: "Потери 4,5% вместо 1,2% в год задержки; в обязательном стрессе это ломает потолок потерь"
  dependencies: "Критичен только вместе с обязательным стрессом: потолок потерь действует с 2038 года"
  plan_overrides:
    assumptions:
      storage_commissioning_lag_months: 12

- risk_id: R3
  event: "Новый поставщик выходит на режим с надёжностью первого года"
  cause: "Earth-New в первый год работы поставляет 88% заказа (профиль надёжности кейса)"
  affected_parameter: "actual_delivery_share[Earth-New] = 0.88 в первый год, 0.94 далее"
  period: "2037-2040"
  probability: 0.30
  probability_low: 0.15
  probability_high: 0.45
  probability_basis: >
    Основание: reliability_profile канала C в data/supply_sources.csv (0,88 в первый год,
    0,94 далее). Вероятность неполной поставки взята как сценарный диапазон вокруг профиля.
  scenario_id: TEAM_RISK_EARTH_NEW_RAMP
  owner: "менеджер контрактов"
  mitigations: [M2, M4]
  mitigation: "Держать гибкий канал незакрытым и увеличить резерв Earth-Flex на годы ввода"
  residual: "Недобор объёма закрывается более дорогим каналом, обслуживание сохраняется"
  dependencies: "Складывается с задержкой ввода: тот же канал, тот же период"

- risk_id: R4
  event: "Рост стоимости доставки с Земли из-за внешних ограничений"
  cause: "Изменение доступности поставщиков, страховых и логистических затрат"
  affected_parameter: "variable_price_multiplier земных каналов 1,25-1,6"
  period: "2036-2038"
  probability: null
  probability_low: null
  probability_high: null
  probability_basis: >
    Вероятность не назначается: статистики нет. Риск исследуется диапазоном множителя
    и сценарным анализом, ожидаемая величина ущерба не публикуется как число.
  scenario_id: TEAM_GEO_PRICE_SHOCK
  owner: "финансовая сторона"
  mitigations: [M5]
  mitigation: "Раннее резервирование по фиксированным ставкам и доля объёма у нового поставщика"
  residual: "Остаточная зависимость от земных каналов сохраняется: альтернативы у плана без Луны нет"
  dependencies: "Может совпасть с обязательным стрессом, отдельный сценарий TEAM_GEO_WITH_STRESS"

- risk_id: R5
  event: "Спрос идёт по низкому сценарию, а обязательства остаются"
  cause: "Заказчики сокращают программу, take-or-pay Earth-Core 70% и Earth-New 50% уже законтрактованы"
  affected_parameter: "спрос по ряду low_total_t при неизменных резервах плана"
  period: "2035-2040"
  probability: null
  probability_low: 0.15
  probability_high: 0.35
  probability_basis: >
    Кейс сам задаёт низкий ряд спроса как проверочный. Вероятность не выводится из данных,
    поэтому дана диапазоном; последствие измеряется оплаченным, но не отобранным объёмом.
  scenario_id: LOW_DEMAND
  owner: "оператор узла"
  mitigations: [M6]
  mitigation: "Снижать резервирование Earth-New до подтверждения спроса"
  residual: "Часть оплаченного объёма всё равно не будет отобрана: это цена гарантии мощности"
  dependencies: "Обратный по знаку к риску высокого спроса: оба проверяются на одном плане"

- risk_id: R6
  event: "В 2040 году в обязательном стрессе базовый канал теряет половину мощности"
  cause: >
    Все три земных канала законтрактованы на пределе (430 т/год при спросе 448,5 т), запас
    гибкости исчерпан: срыв у Earth-Core закрывать больше нечем, кроме аварийного канала.
  affected_parameter: "capacity_multiplier[Earth-Core] = 0.5 в 2040 поверх обязательного стресса"
  period: "2040"
  probability: null
  probability_low: 0.10
  probability_high: 0.30
  probability_basis: >
    Сценарная проверка структурной уязвимости, а не событие со статистикой: показывает,
    что именно происходит, когда исчерпан запас мощности последнего года.
  scenario_id: TEAM_RISK_EARTH_CAP_2040
  owner: "оператор узла"
  mitigations: [M1, M7]
  mitigation: "Держать аварийный договор: именно он закрывает провал последнего года"
  residual: >
    С действующим аварийным договором дефицит 0,2 т и обслуживание 99,96%. Без него дефицит
    вырастает на 53,8 т, а обслуживание падает до 88,0%: это и есть измеренная ценность решения.
  dependencies: "Прямое следствие выбора стратегии без Lunar-ISRU, связан с решением D-15"
