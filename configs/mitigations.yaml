# Меры реагирования. Мера это изменение решения плана, а не обещание в тексте: поэтому у неё
# есть стоимость (насколько дороже план в базовом сценарии), эффект (насколько меньше
# последствие риска) и остаточный риск (что остаётся после меры). Всё считается движком.

- mitigation_id: M1
  label: "Аварийный резерв на уровне требования 45 суток"
  description: >
    Резервирование аварийного канала поднимается до объёма требуемого резерва года.
    Платим за доступность заранее, вызываем только при срыве базового канала.
  owner: "оператор узла"
  basis: "TEAM_DECISION: страховка мощности, ограничена мощностью канала 80 т/год"
  plan_overrides:
    reservations:
      E: {2035: 13.6, 2036: 19.0, 2037: 60.0, 2038: 60.0, 2039: 60.0, 2040: 80.0}

- mitigation_id: M2
  label: "Запас на старте выше требования"
  description: >
    Начальный запас увеличивается с 13,6 до 25 т: подготовительный период закупает больше,
    расход относится на 2035 год. Даёт время на реакцию при срыве поставки.
  owner: "оператор узла"
  basis: "TEAM_DECISION: буфер сверх требования 45 суток, ограничен ёмкостью базового хранилища 70 т"
  plan_overrides:
    inventory_policy:
      opening_stock_t: 25.0

- mitigation_id: M3
  label: "Раннее решение по модернизации хранилища (уже в плане)"
  description: >
    ZBO финансируется в 2036 году — это самый ранний год, когда опция доступна по данным кейса.
    Расчёт показывает нулевую стоимость и нулевой эффект именно потому, что мера уже принята:
    запас в два года до начала действия потолка потерь покрывает задержку пусконаладки.
  owner: "руководитель инвестиционного проекта"
  basis: "CASE_INPUT: опция ZBO доступна с 2036 года, раньше её купить нельзя"
  plan_overrides:
    investments:
      ZBO: 2036

- mitigation_id: M4
  label: "Гибкий канал не снимается после ввода нового поставщика"
  description: >
    Earth-Flex держится на полной мощности 110 т/год в 2038 году вместо 38,5 т.
    Это дороже в базовом сценарии, но закрывает провал объёма у нового поставщика.
  owner: "менеджер контрактов"
  basis: "TEAM_DECISION: плата за резерв Earth-Flex 0,15 млн за т/год, take-or-pay отсутствует"
  plan_overrides:
    reservations:
      B: {2038: 110.0}

- mitigation_id: M5
  label: "Раннее резервирование объёма у нового поставщика"
  description: >
    Резерв Earth-New в 2037 году поднимается с 68,9 до 130 т/год: объём законтрактован
    по ставке 2035 года до ценового шока, зато take-or-pay 50% оплачивается раньше.
  owner: "финансовая сторона"
  basis: "TEAM_DECISION: цена канала постоянная в ценах 2035 года, ToP 50% по данным кейса"
  plan_overrides:
    reservations:
      C: {2037: 130.0}

- mitigation_id: M6
  label: "Сдержанное резервирование нового поставщика"
  description: >
    Резерв Earth-New в 2038-2040 годах снижается со 130 до 100 т/год. Меньше оплаченного
    минимума take-or-pay при низком спросе, но меньше запас мощности при высоком.
  owner: "оператор узла"
  basis: "TEAM_DECISION: обратная сторона гарантии мощности, проверяется в обоих рядах спроса"
  plan_overrides:
    reservations:
      C: {2038: 100.0, 2039: 100.0, 2040: 100.0}

- mitigation_id: M7
  label: "Проверка ценности решения: отказ от аварийного резерва"
  description: >
    Контрфактическая мера: аварийный канал не резервируется вовсе. Показывает, сколько
    стоит уже принятое решение держать аварийный договор и что происходит без него.
    Отрицательный эффект здесь это доказательство полезности текущего решения.
  owner: "оператор узла"
  basis: "TEAM_DECISION: контрфактический прогон для оценки ценности действующей меры"
  plan_overrides:
    reservations:
      E: {2035: 0.0, 2036: 0.0, 2037: 0.0, 2038: 0.0, 2039: 0.0, 2040: 0.0}
