scenario_id: TEAM_RISK_EARTH_CAP_2040
label_ru: "Риск: в 2040 году в стрессе базовый канал теряет половину мощности"
status: TEAM_RESEARCH
base_scenario: MANDATORY_STRESS
capacity_multiplier:
  Earth-Core:
    2040: 0.5
combination_rule: >
  Поверх обязательного стресса доступная мощность Earth-Core в 2040 году уменьшена вдвое.
  Стресс задаёт спрос и цены, риск задаёт только мощность: один и тот же эффект не начисляется
  дважды. Сочетание объявлено явно, потому что кейс запрещает молчаливое смешивание сценариев.
notes:
  - "Проверяет структурную уязвимость последнего года: три земных канала законтрактованы на пределе 430 т/год при спросе 448,5 т."
  - "Take-or-pay Earth-Core при этом не снимается: оплаченный минимум остаётся обязательством."
  - "Показывает цену отказа от лунного канала в терминах запаса мощности, а не только денег."
