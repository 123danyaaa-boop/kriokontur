scenario_id: TEAM_REAL_LAUNCH_DECLINE
label_ru: "Рынок: цена доставки с Земли падает на 40% с 2038 года"
status: TEAM_RESEARCH
base_scenario: BASE
variable_price_multiplier:
  Earth-Core: {2038: 0.6, 2039: 0.6, 2040: 0.6}
  Earth-Flex: {2038: 0.6, 2039: 0.6, 2040: 0.6}
  Earth-New: {2038: 0.6, 2039: 0.6, 2040: 0.6}
  Emergency: {2038: 0.6, 2039: 0.6, 2040: 0.6}
combination_rule: >
  Меняется только переменная цена земных каналов с 2038 года. Спрос, мощности и лунный канал как в BASE.
  Сценарий проверяет главный внешний риск лунной инвестиции: удешевление выведения сверхтяжёлыми
  многоразовыми носителями. Величина 40% выбрана у найденного порога окупаемости (см. протокол 12).
notes:
  - "Основание: цены Falcon 9 и Falcon Heavy за последние годы не снижались, но заявленная цель Starship на порядок ниже; см. docs/DATA_VALIDATION.md."
