variable_price_multiplier:
  Earth-Core:
    2036: 1.4
    2037: 1.4
    2038: 1.4
  Earth-Flex:
    2036: 1.4
    2037: 1.4
    2038: 1.4
  Earth-New:
    2036: 1.25
    2037: 1.25
