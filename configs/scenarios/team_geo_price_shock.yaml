combination_rule: >
  Условное событие меняет только переменную цену земных каналов и аварийной поставки в 2036–2038.
  Ставки резервирования, CAPEX и спрос не меняются. Это сценарий, а не прогноз конкретного события,
  величина задана диапазоном и восстанавливается к контрольным ценам одним переключением.
notes:
  - "Множители 1,25–1,6 это TEAM_ASSUMPTION без статистики: показываем чувствительность, а не вероятность."
  - "Причинная цепочка: ограничение доступности поставщиков -> страховые и логистические затраты -> переменная цена канала."
