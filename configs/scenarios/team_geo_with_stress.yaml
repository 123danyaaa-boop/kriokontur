scenario_id: TEAM_GEO_WITH_STRESS
label_ru: "Геополитика поверх обязательного стресса"
status: TEAM_RESEARCH
base_scenario: MANDATORY_STRESS
variable_price_multiplier:
  Earth-Core:
    2036: 1.4
    2037: 1.4
    2040: 1.4
  Earth-Flex:
    2036: 1.4
    2037: 1.4
    2040: 1.4
combination_rule: >
  Ценовой шок команды применяется только к тем годам, где обязательный стресс цену не меняет
  (2036, 2037 и 2040). В 2038 и 2039 действует множитель стресса 1,25 и второй раз не начисляется.
  Спрос и доли поставки Луны берутся из обязательного стресса без изменений.
notes:
  - "Демонстрация правила сочетания шоков: один и тот же ценовой эффект не учитывается дважды."
