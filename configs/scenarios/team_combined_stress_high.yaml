scenario_id: TEAM_COMBINED_STRESS_HIGH
label_ru: "Комбинированный: обязательный стресс на высоком спросе"
status: TEAM_RESEARCH
base_scenario: MANDATORY_STRESS
demand_series: high
demand_multiplier:
  default: 1.0
  2038: 1.0
  2039: 1.0
  2040: 1.0
critical_demand_multiplier:
  default: 1.0
  2038: 1.0
  2039: 1.0
  2040: 1.0
combination_rule: >
  Спрос берётся из колонки high_total_t кейса, множитель 1,15 обязательного стресса к нему
  повторно не применяется. Ценовой шок и доли поставки Луны наследуются от обязательного
  стресса без изменений. Это отдельный исследовательский тест, он не заменяет контрольный стресс.
notes:
  - "Кейс запрещает автоматически складывать стресс и высокий спрос, поэтому комбинация объявлена явно."
