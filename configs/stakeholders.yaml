# Карта заинтересованных сторон (TEAM_DECISION).
#
# Кейс (с. 12) требует показать: кто получает топливо, кто несёт затраты и риск, кто требует
# надёжности или возврата вложений; связать интересы с метриками и договорными обязательствами;
# показать, как меняются решения, затраты, обслуживание и ответственность при реализации риска.
#
# Каждая метрика это ключ расчёта из RunResult (stakeholders.METRICS), а не отдельная формула:
# сторона видит те же числа, что и баланс, просто в своём разрезе.

- stakeholder_id: OPERATOR
  name: "Оператор топливного узла"
  role: "Владеет узлом, планирует снабжение, отвечает за исполнение плана"
  gets: "Управляемый запас и исполнимый план"
  pays: "Все расходы контура: закупки, резерв, хранение, OPEX, CAPEX"
  bears_risk: "Риск объёма по take-or-pay, риск переполнения и дефицита, риск сроков ввода"
  requires: "Выполнение ограничений кейса при минимальных приведённых расходах"
  metrics: [pv_mln, total_mln, hard_violations, min_reserve_margin_t, overflow_t]
  obligations: [C-A, C-B, C-C, C-D, C-E]

- stakeholder_id: CRITICAL
  name: "Критические потребители"
  role: "Миссии, для которых топливо нельзя заменить или отложить"
  gets: "Критический объём в первую очередь при любом дефиците"
  pays: "Ничего напрямую: их спрос обеспечивается оператором"
  bears_risk: "Прямой риск срыва миссии при недопоставке"
  requires: "Обслуживание критического спроса не ниже 99% каждый год"
  metrics: [sl_critical_worst, critical_shortage_t, reserve_days_worst]
  obligations: [C-A, C-E]

- stakeholder_id: COMMERCIAL
  name: "Коммерческие потребители"
  role: "Гражданские и коммерческие заказчики топлива"
  gets: "Остаток объёма после критического спроса"
  pays: "Косвенно через стоимость тонны обслуженного спроса"
  bears_risk: "Первыми теряют объём при дефиците"
  requires: "Общее обслуживание не ниже 97% и предсказуемая стоимость тонны"
  metrics: [sl_total_worst, shortage_t, cost_per_served_t]
  obligations: [C-B]

- stakeholder_id: EARTH_SUPPLIERS
  name: "Земные поставщики и операторы запуска"
  role: "Каналы A, B и C: поставка топлива и пусковые услуги"
  gets: "Переменные платежи и плату за резервирование мощности"
  pays: "Издержки исполнения, возврат платы за резерв при срыве"
  bears_risk: "Риск срыва рейса и недозагрузки зарезервированной мощности"
  requires: "Предсказуемый объём заказа и соблюдение минимума take-or-pay"
  metrics: [earth_payments_mln, earth_delivered_t, earth_utilisation, unused_paid_t]
  obligations: [C-A, C-B, C-C]

- stakeholder_id: EMERGENCY_SUPPLIER
  name: "Аварийный поставщик"
  role: "Канал E: поставка по вызову в срок шести недель"
  gets: "Плату за резерв всегда и переменный платёж при вызове"
  pays: "Готовность держать мощность в ожидании вызова"
  bears_risk: "Риск срока прибытия партии"
  requires: "Оплату доступности независимо от факта вызова"
  metrics: [emergency_reservation_mln, emergency_delivered_t, emergency_max_share]
  obligations: [C-E]

- stakeholder_id: INVESTOR
  name: "Инвестор и финансирующая сторона"
  role: "Финансирует CAPEX: модернизацию хранилища, опцион и лунную установку"
  gets: "Актив и снижение удельных расходов в будущем"
  pays: "CAPEX по годам решений"
  bears_risk: "Риск невозврата вложений, если мощность не используется"
  requires: "Соблюдение лимитов CAPEX и обоснование каждого инвестиционного шага"
  metrics: [capex_total_mln, capex_through_2037_mln, capex_headroom_2037_mln, cost_per_served_t]
  obligations: [C-C, C-D]
